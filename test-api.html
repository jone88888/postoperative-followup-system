<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API测试</title>
</head>
<body>
    <h1>后端API连通性测试</h1>

    <div>
        <h2>1. 测试登录API</h2>
        <button onclick="testLogin()">测试管理员登录</button>
        <pre id="loginResult"></pre>
    </div>

    <div>
        <h2>2. 测试医生列表API</h2>
        <button onclick="testDoctors()">获取医生列表</button>
        <pre id="doctorsResult"></pre>
    </div>

    <div>
        <h2>3. 测试系统统计API</h2>
        <button onclick="testStats()">获取系统统计</button>
        <pre id="statsResult"></pre>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        async function testLogin() {
            try {
                const response = await fetch(`${API_BASE}/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: 'admin',
                        password: 'admin123',
                        role: 'admin'
                    })
                });
                const data = await response.json();
                document.getElementById('loginResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('loginResult').textContent = 'Error: ' + error.message;
            }
        }

        async function testDoctors() {
            try {
                const response = await fetch(`${API_BASE}/doctors/list/`);
                const data = await response.json();
                document.getElementById('doctorsResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('doctorsResult').textContent = 'Error: ' + error.message;
            }
        }

        async function testStats() {
            try {
                const response = await fetch(`${API_BASE}/admin/statistics/`);
                const data = await response.json();
                document.getElementById('statsResult').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                document.getElementById('statsResult').textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
